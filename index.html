<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shadow Byte</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root{
  --sky-lav:#EAE0FF;
  --sky-pink:#FFE1F0;
  --sky-mint:#DFFBEA;
  --card-bg:#FFFDFC;
  --pink:#FFC2DA;
  --pink-deep:#FF9EC4;
  --lav:#D9C9FF;
  --lav-deep:#B79EFF;
  --mint:#B8F1D2;
  --butter:#FFE9A8;
  --text-plum:#6B5B8A;
  --text-soft:#9587B0;
  --shadow-soft: 0 10px 30px rgba(183,158,255,.25);
}

*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:'Quicksand',sans-serif;
  color:var(--text-plum);
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  overflow:hidden;
  position:relative;
  background:
    url('assets/background.jpg') center/cover no-repeat,
    linear-gradient(180deg, var(--sky-lav) 0%, var(--sky-pink) 55%, var(--sky-mint) 100%);
}

body::before{
  content:"";
  position:fixed;
  inset:0;
  background:linear-gradient(180deg, rgba(255,255,255,.35), rgba(255,255,255,.55));
  pointer-events:none;
  z-index:1;
}

/* ===== NUBES FLOTANTES ===== */
.cloud{
  position:fixed;
  z-index:2;
  opacity:.9;
  filter:drop-shadow(0 8px 12px rgba(183,158,255,.15));
  pointer-events:none;
  animation:drift linear infinite;
}
.cloud svg{ width:100%; height:100%; display:block; }
.c1{ width:180px; top:8%;  left:-220px; animation-duration:46s; }
.c2{ width:120px; top:22%; left:-180px; animation-duration:34s; animation-delay:-10s; opacity:.75;}
.c3{ width:220px; top:68%; left:-260px; animation-duration:58s; animation-delay:-22s; }
.c4{ width:100px; top:45%; left:-160px; animation-duration:28s; animation-delay:-6s; opacity:.7;}
.c5{ width:150px; top:80%; left:-200px; animation-duration:40s; animation-delay:-30s; }

@keyframes drift{
  from{ transform:translateX(0); }
  to{ transform:translateX(calc(100vw + 300px)); }
}

@media (prefers-reduced-motion: reduce){
  .cloud{ animation:none; display:none; }
}

/* ===== TARJETA PRINCIPAL ===== */
.wrap{
  position:relative;
  z-index:3;
  width:min(430px, 90vw);
  padding:44px 36px 36px;
  background:var(--card-bg);
  border-radius:38px;
  border:2px solid #ffffff;
  box-shadow:var(--shadow-soft), inset 0 0 0 6px rgba(255,255,255,.6);
  text-align:center;
  display:flex;
  flex-direction:column;
  align-items:center;
}

.wrap > *{ max-width:100%; }
.title, #meta, .bar{ width:100%; }

.deco-flower{
  position:absolute;
  width:34px;
  height:34px;
}
.deco-flower.tl{ top:-16px; left:-14px; transform:rotate(-15deg); }
.deco-flower.br{ bottom:-16px; right:-14px; transform:rotate(20deg); }

.title{
  font-family:'Baloo 2', sans-serif;
  font-weight:800;
  font-size:2.6rem;
  letter-spacing:1px;
  background:linear-gradient(90deg, var(--lav-deep), var(--pink-deep), var(--butter));
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  line-height:1.1;
}

.subtitle{
  margin-top:6px;
  font-size:.85rem;
  color:var(--text-soft);
  letter-spacing:.5px;
}

/* ===== META / PROGRESO ===== */
#meta{
  margin-top:30px;
  font-family:'Baloo 2', sans-serif;
  font-size:1.15rem;
  color:var(--lav-deep);
  display:flex;
  align-items:center;
  justify-content:center;
  gap:8px;
}
#meta .ico{ width:20px; height:20px; }

.bar{
  width:100%;
  height:22px;
  margin-top:12px;
  background:#F3EEFF;
  border-radius:20px;
  overflow:hidden;
  box-shadow:inset 0 2px 6px rgba(183,158,255,.25);
  border:1.5px solid #EEE6FF;
}

.fill{
  height:100%;
  width:0%;
  border-radius:20px;
  background:linear-gradient(90deg, var(--pink), var(--lav), var(--mint), var(--butter));
  background-size:200% 100%;
  animation:shimmer 3s linear infinite;
  transition:width .5s ease;
}

@keyframes shimmer{
  0%{ background-position:0% 0%; }
  100%{ background-position:200% 0%; }
}

/* ===== BOTÓN ===== */
.btn{
  margin-top:26px;
  padding:16px 42px;
  font-family:'Baloo 2', sans-serif;
  font-size:1.15rem;
  font-weight:700;
  color:#7A4B8C;
  letter-spacing:.5px;
  border:none;
  border-radius:999px;
  cursor:pointer;
  background:linear-gradient(180deg, #FFD3E8 0%, #FFB8DC 100%);
  box-shadow:
    0 6px 0 #F193C7,
    0 10px 18px rgba(241,147,199,.45),
    inset 0 2px 3px rgba(255,255,255,.8);
  transition:transform .15s ease, box-shadow .15s ease;
}

.btn:hover:not(:disabled){
  transform:translateY(-2px);
  box-shadow:
    0 8px 0 #F193C7,
    0 14px 22px rgba(241,147,199,.5),
    inset 0 2px 3px rgba(255,255,255,.8);
}

.btn:active:not(:disabled){
  transform:translateY(3px);
  box-shadow:
    0 2px 0 #F193C7,
    0 4px 10px rgba(241,147,199,.4),
    inset 0 2px 3px rgba(255,255,255,.8);
}

.btn:disabled{
  opacity:.55;
  cursor:not-allowed;
  background:linear-gradient(180deg, #EFE9F7, #E3DBF2);
  box-shadow:0 6px 0 #D7CCEC, inset 0 2px 3px rgba(255,255,255,.6);
  color:#B3A6CC;
}

/* ===== TIMER ===== */
.timer{
  margin-top:22px;
  font-family:'Baloo 2', sans-serif;
  font-size:1.5rem;
  color:var(--lav-deep);
  background:#F7F2FF;
  display:inline-block;
  padding:8px 22px;
  border-radius:16px;
  box-shadow:inset 0 2px 4px rgba(183,158,255,.2);
}

/* ===== AVATAR OVERLAY ===== */
#avatarOverlay{
  position:fixed;
  inset:0;
  background:rgba(234,224,255,.55);
  backdrop-filter:blur(2px);
  display:none;
  z-index:99999;
}

#avatarOverlay.active{ display:block; }

.avatar{
  position:absolute;
  bottom:36px;
  left:36px;
  display:flex;
  align-items:flex-end;
  gap:18px;
}

.avatar img{
  width:180px;
  filter:drop-shadow(0 10px 14px rgba(183,158,255,.4));
}

.bubble{
  position:relative;
  background:#fff;
  color:var(--text-plum);
  font-family:'Quicksand', sans-serif;
  font-weight:600;
  padding:16px 20px;
  border-radius:22px;
  max-width:300px;
  box-shadow:var(--shadow-soft);
  border:2px solid #F5EEFF;
}

.bubble::after{
  content:"";
  position:absolute;
  left:-14px;
  bottom:20px;
  width:0; height:0;
  border:12px solid transparent;
  border-right-color:#fff;
}

/* ===== BLACKOUT ===== */
#blackout{
  position:fixed;
  inset:0;
  background:radial-gradient(circle at center, rgba(234,224,255,.9), rgba(255,225,240,.95));
  display:none;
  z-index:999999;
}

#blackout.active{ display:block; }

/* ===== ADMIN PANEL ===== */
#adminPanel{
  display:none;
  position:fixed;
  top:20px;
  right:20px;
  z-index:9999999;
  background:#fff;
  border-radius:20px;
  padding:18px;
  box-shadow:var(--shadow-soft);
  border:2px solid #F0E8FF;
  width:250px;
  font-family:'Quicksand',sans-serif;
}

#adminPanel.active{ display:block; }

#adminPanel h3{
  font-family:'Baloo 2',sans-serif;
  font-size:1rem;
  color:var(--lav-deep);
  margin-bottom:10px;
  text-align:center;
}

.admin-btn{
  width:100%;
  padding:10px;
  margin-bottom:8px;
  border:none;
  border-radius:12px;
  background:var(--lav);
  color:#5A4A7A;
  font-family:'Quicksand',sans-serif;
  font-weight:700;
  cursor:pointer;
  font-size:.85rem;
  transition:background .15s ease;
}

.admin-btn:hover{ background:var(--lav-deep); color:#fff; }

.admin-input, .admin-select{
  width:100%;
  padding:8px;
  margin-bottom:8px;
  border-radius:10px;
  border:1.5px solid #EEE6FF;
  font-family:'Quicksand',sans-serif;
  font-size:.85rem;
}

#adminStatus{
  font-size:.75rem;
  color:var(--text-soft);
  text-align:center;
  margin-top:4px;
}
</style>
</head>

<body>

<!-- NUBES DECORATIVAS -->
<div class="cloud c1"><svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg"><path fill="#fff" d="M40 70c-16 0-28-12-28-27 0-14 11-26 25-27 4-14 17-24 32-24 16 0 30 11 34 26 13 1 24 12 24 26 0 14-12 26-27 26H40z"/></svg></div>
<div class="cloud c2"><svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg"><path fill="#FFEAF4" d="M40 70c-16 0-28-12-28-27 0-14 11-26 25-27 4-14 17-24 32-24 16 0 30 11 34 26 13 1 24 12 24 26 0 14-12 26-27 26H40z"/></svg></div>
<div class="cloud c3"><svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg"><path fill="#fff" d="M40 70c-16 0-28-12-28-27 0-14 11-26 25-27 4-14 17-24 32-24 16 0 30 11 34 26 13 1 24 12 24 26 0 14-12 26-27 26H40z"/></svg></div>
<div class="cloud c4"><svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg"><path fill="#EFE9FF" d="M40 70c-16 0-28-12-28-27 0-14 11-26 25-27 4-14 17-24 32-24 16 0 30 11 34 26 13 1 24 12 24 26 0 14-12 26-27 26H40z"/></svg></div>
<div class="cloud c5"><svg viewBox="0 0 200 100" xmlns="http://www.w3.org/2000/svg"><path fill="#fff" d="M40 70c-16 0-28-12-28-27 0-14 11-26 25-27 4-14 17-24 32-24 16 0 30 11 34 26 13 1 24 12 24 26 0 14-12 26-27 26H40z"/></svg></div>

<div class="wrap">

  <img class="deco-flower tl" src="assets/icon-flower.png" onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><g fill=%22%23FFB8DC%22><circle cx=%2232%22 cy=%2214%22 r=%2211%22/><circle cx=%2250%22 cy=%2232%22 r=%2211%22/><circle cx=%2232%22 cy=%2250%22 r=%2211%22/><circle cx=%2214%22 cy=%2232%22 r=%2211%22/></g><circle cx=%2232%22 cy=%2232%22 r=%229%22 fill=%22%23FFE18F%22/></svg>'">
  <img class="deco-flower br" src="assets/icon-flower.png" onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><g fill=%22%23C9B6FF%22><circle cx=%2232%22 cy=%2214%22 r=%2211%22/><circle cx=%2250%22 cy=%2232%22 r=%2211%22/><circle cx=%2232%22 cy=%2250%22 r=%2211%22/><circle cx=%2214%22 cy=%2232%22 r=%2211%22/></g><circle cx=%2232%22 cy=%2232%22 r=%229%22 fill=%22%23FFE18F%22/></svg>'">

  <h1 class="title">shadow byte</h1>

  <div id="meta">
    <img class="ico" src="assets/icon-star.png" onerror="this.onerror=null;this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22><path fill=%22%23FFC96B%22 d=%22M12 2l2.6 6.6L22 9l-5.4 4.8L18 21l-6-3.6L6 21l1.4-7.2L2 9l7.4-.4z%22/></svg>'">
    <span id="meta-text">0/15</span>
  </div>

  <div class="bar">
    <div id="fill" class="fill"></div>
  </div>

  <button id="btn" class="btn">TOCAR</button>

  <div id="timer" class="timer"></div>

</div>

<!-- AVATAR -->
<div id="avatarOverlay">
<div class="avatar">
<img id="avatarImg" src="assets/1.png">
<div class="bubble" id="speech"></div>
</div>
</div>

<div id="blackout"></div>

<!-- PANEL ADMIN (solo visible con ?admin en la URL) -->
<div id="adminPanel">
  <h3>✦ Panel Admin ✦</h3>
  <button id="startTimerBtn" class="admin-btn">Iniciar contador (1h)</button>
  <button id="resetTimerBtn" class="admin-btn">Reiniciar contador</button>
  <hr style="border:none;border-top:1px solid #EEE6FF;margin:10px 0;">
  <input id="msgInput" class="admin-input" type="text" placeholder="Mensaje del avatar...">
  <select id="avatarSelect" class="admin-select">
    <option value="1.png">Avatar 1</option>
    <option value="2.png">Avatar 2</option>
    <option value="3.png">Avatar 3</option>
    <option value="4.png">Avatar 4</option>
  </select>
  <button id="sendMsgBtn" class="admin-btn">Mostrar mensaje</button>
  <button id="hideMsgBtn" class="admin-btn">Ocultar mensaje</button>
  <hr style="border:none;border-top:1px solid #EEE6FF;margin:10px 0;">
  <input id="totalInput" class="admin-input" type="number" placeholder="Nuevo total (ej: 15)">
  <button id="setTotalBtn" class="admin-btn">Actualizar total y resetear votos</button>
  <div id="adminStatus"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
import {
  getFirestore,
  doc,
  runTransaction,
  onSnapshot,
  setDoc,
  getDoc,
  updateDoc,
  collection,
  getDocs,
  deleteDoc
} from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

/* CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyB685cJZl1HCK6He3sRdUNDu_oPOyO6dOw",
  authDomain: "gorflacos.firebaseapp.com",
  databaseURL: "https://gorflacos-default-rtdb.firebaseio.com",
  projectId: "gorflacos",
  storageBucket: "gorflacos.firebasestorage.app",
  messagingSenderId: "507648872448",
  appId: "1:507648872448:web:72dae319bcde4cea4e08e5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* REFS */
const progressRef = doc(db,"progress","kode_main");
const systemRef = doc(db,"system","globalTimer");
const announcementRef = doc(db,"system","globalAnnouncement");

/* ELEMENTOS */
const btn = document.getElementById("btn");
const fill = document.getElementById("fill");
const metaText = document.getElementById("meta-text");
const timerEl = document.getElementById("timer");

const avatarOverlay = document.getElementById("avatarOverlay");
const avatarImg = document.getElementById("avatarImg");
const speech = document.getElementById("speech");

/* DEVICE ID */
let deviceId = localStorage.getItem("device_id");
if(!deviceId){
  deviceId = crypto.randomUUID();
  localStorage.setItem("device_id",deviceId);
}

const userRef = doc(db,"votes",deviceId);

/* ¿YA VOTÓ EN ESTA RONDA? — comparamos contra el round actual */
let currentRound = 0;

async function checkVoteLock(){
  const userSnap = await getDoc(userRef);
  if(userSnap.exists() && userSnap.data().round === currentRound){
    btn.disabled = true;
  } else {
    btn.disabled = false;
  }
}

/* COOLDOWN */
let lastClick = 0;

/* CLICK */
btn.onclick = async () => {
  const now = Date.now();
  if(now - lastClick < 3000) return;
  lastClick = now;

  btn.disabled = true;

  try{
    await runTransaction(db, async (t)=>{
      const progressSnap = await t.get(progressRef);
      const round = progressSnap.exists() ? (progressSnap.data().round || 0) : 0;

      const userSnap = await t.get(userRef);

      /* 🔒 YA VOTÓ EN ESTA RONDA */
      if(userSnap.exists() && userSnap.data().round === round){
        throw "bloqueado";
      }

      let c = progressSnap.exists()? progressSnap.data().current || 0 : 0;
      c++;

      t.set(progressRef,{current:c},{merge:true});
      t.set(userRef,{voted:true,time:Date.now(),round:round});
    });
  }catch(e){
    console.log("bloqueado");
    btn.disabled = false;
  }
};

/* PROGRESO */
onSnapshot(progressRef,(snap)=>{
  const d = snap.data() || {};
  const c = d.current || 0;
  const t = d.total || 15;
  currentRound = d.round || 0;

  metaText.textContent = c + "/" + t;
  fill.style.width = (c/t*100)+"%";

  checkVoteLock();

  if(c>=t){
    activateGlobal();
  }
});

/* COUNTDOWN — controlado desde Firebase (systemRef.startTime), dura 1h */
const DURATION_MS = 60*60*1000; // 1 hora

function format(ms){
  let s=Math.floor(ms/1000);
  let h=Math.floor(s/3600);
  let m=Math.floor((s%3600)/60);
  let sec=s%60;
  return `${h.toString().padStart(2,"0")}:${m.toString().padStart(2,"0")}:${sec.toString().padStart(2,"0")}`;
}

let startTime = null;

function tick(){
  if(!startTime){
    timerEl.textContent = "--:--:--";
    return;
  }

  const now = Date.now();
  const target = startTime + DURATION_MS;
  const diff = target - now;

  if(diff<=0){
    activateGlobal();
    timerEl.textContent="00:00:00";
    return;
  }

  timerEl.textContent=format(diff);
}

setInterval(tick,1000);

/* GLOBAL */
async function activateGlobal(){
  await setDoc(systemRef,{closed:true},{merge:true});
}

onSnapshot(systemRef,(snap)=>{
  const d = snap.data() || {};

  startTime = d.startTime || null;

  if(d.closed){
    btn.disabled = true;
    timerEl.textContent = "COMPLETADO";
    fill.style.width = "100%";
    metaText.textContent = "COMPLETADO";
  }

  tick();
});

/* AVATAR */
onSnapshot(announcementRef,(snap)=>{
  const d = snap.data();

  if(d?.active){
    let avatarFile = String(d.avatar || "1.png").trim();
    const allowed = ["1.png","2.png","3.png","4.png"];

    if(!allowed.includes(avatarFile)){
      avatarFile="1.png";
    }

    avatarImg.src="assets/"+avatarFile;
    avatarImg.onerror=()=>avatarImg.src="assets/1.png";

    speech.textContent=d.text||"";

    avatarOverlay.classList.add("active");
  }else{
    avatarOverlay.classList.remove("active");
  }
});

/* ============ ADMIN PANEL ============ */
const params = new URLSearchParams(window.location.search);
const isAdmin = params.has("admin");

if(isAdmin){
  document.getElementById("adminPanel").classList.add("active");

  const adminStatus = document.getElementById("adminStatus");
  function flash(msg){
    adminStatus.textContent = msg;
    setTimeout(()=>{ adminStatus.textContent=""; }, 2500);
  }

  /* Iniciar contador de 1h */
  document.getElementById("startTimerBtn").onclick = async () => {
    await setDoc(systemRef,{startTime:Date.now(), closed:false},{merge:true});
    flash("Contador iniciado ✧");
  };

  /* Reiniciar contador (borra startTime y closed) */
  document.getElementById("resetTimerBtn").onclick = async () => {
    await setDoc(systemRef,{startTime:null, closed:false},{merge:true});
    flash("Contador reiniciado ✧");
  };

  /* Mostrar mensaje del avatar */
  document.getElementById("sendMsgBtn").onclick = async () => {
    const text = document.getElementById("msgInput").value;
    const avatar = document.getElementById("avatarSelect").value;
    await setDoc(announcementRef,{active:true, text, avatar});
    flash("Mensaje enviado ✧");
  };

  /* Ocultar mensaje del avatar */
  document.getElementById("hideMsgBtn").onclick = async () => {
    await setDoc(announcementRef,{active:false},{merge:true});
    flash("Mensaje ocultado ✧");
  };

  /* Actualizar total y resetear votos (nueva ronda) */
  document.getElementById("setTotalBtn").onclick = async () => {
    const newTotal = parseInt(document.getElementById("totalInput").value, 10);
    if(!newTotal || newTotal < 1){
      flash("Total inválido");
      return;
    }

    await runTransaction(db, async (t)=>{
      const progressSnap = await t.get(progressRef);
      const prevRound = progressSnap.exists() ? (progressSnap.data().round || 0) : 0;

      t.set(progressRef, {
        current: 0,
        total: newTotal,
        round: prevRound + 1
      });
    });

    // reabre votación globalmente también
    await setDoc(systemRef,{closed:false},{merge:true});

    flash("Total actualizado, votos reseteados ✧");
  };
}
</script>

</body>
</html>
